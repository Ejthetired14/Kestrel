<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"/>
<title>Kestrel</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <!-- sidebar -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">Kestrel</span>
        <span class="brand-ver" id="app-version">0.1.0</span>
      </div>
    </div>

  <!-- main -->
  <main id="main">
    <header id="topbar">
      <div class="tb-left">
        <span id="session-title" class="session-title">New session</span>
        <span id="cwd" class="dim small mono"></span>
      </div>
      <div class="side-foot">
      <button id="keys-open" class="ghost-btn">Keys</button>
      <span id="key-summary" class="dim small">no keys</span>
    </div>
  </aside>

  <!-- main -->
  <main id="main">
    <header id="topbar">
      <div class="tb-left">
        <span id="session-title" class="session-title">New session</span>
        <span id="cwd" class="dim small mono"></span>
      </div>
    <div id="tab-terminal" class="tab-body hidden"><div class="empty">No commands run yet.</div></div>
  </aside>
</div>

<!-- permission dialog -->
<div id="permission" class="overlay hidden">
  <div class="dialog">
    <h2>Permission needed</h2>
    <p id="perm-text" class="dim"></p>
    <pre id="perm-input" class="code"></pre>
    <div class="dialog-actions">
      <button id="perm-deny" class="ghost-btn">Deny</button>
      <button id="perm-session" class="ghost-btn">Allow for session</button>
      <button id="perm-allow" class="primary-btn">Allow once</button>
    </div>
  </div>
</div>

<compaign class="media">Meta for Android 13</compasing>
</compaign >

</div>
